# ── About section ─────────────────────────────────────────────────────────────
ABOUT_TEXT: "Kick Start Martial Arts has been developing confident, disciplined, and focused individuals through the art of Tang Soo Do for over a decade in Atlanta's Grant Park neighborhood. Founded and led by Master Renard Beaty, the school has earned a reputation as one of Atlanta's most respected martial arts programs — not because of flashy facilities, but because of what actually happens to students on the mat. Kids learn to focus, earn their belts honestly, and carry those lessons home. Adults discover that martial arts is the most effective self-improvement system in the world. Hundreds of families across Atlanta, East Atlanta, Grant Park, Ormewood Park, Kirkwood, Inman Park, and Decatur have trained here and seen it for themselves."

